# Site nginx de l'HÔTE pour redistribution.lhspla-ci.org (mode docker-compose.proxy.yml).
# L'application tourne dans Docker et n'écoute que sur 127.0.0.1:8095.
#
# Installation (sudo requis) :
#   sudo cp deploy/nginx/redistribution.conf /etc/nginx/sites-available/redistribution.lhspla-ci.org
#   sudo ln -s /etc/nginx/sites-available/redistribution.lhspla-ci.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d redistribution.lhspla-ci.org --redirect
# certbot ajoute lui-même le bloc HTTPS (listen 443, certificat) et la redirection HTTP → HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name redistribution.lhspla-ci.org;

    # Imports Excel jusqu'à 10 Mo
    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    130s;   # génération de plan avec appel IA (120 s côté conteneur)
    }
}
