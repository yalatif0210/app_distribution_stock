# Contenu commun aux modes HTTP et HTTPS (inclus dans les blocs server).
root /usr/share/nginx/html;
index index.html;

# Imports Excel jusqu'à 10 Mo côté backend (nginx limite à 1 Mo par défaut)
client_max_body_size 10M;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# API : relais vers le backend (réseau interne Docker)
location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_origine;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;          # génération de plan avec appel IA
}

# Assets compilés Angular (noms hachés) : cache long
location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# SPA : toutes les routes Angular renvoient index.html
location / {
    try_files $uri $uri/ /index.html;
}
