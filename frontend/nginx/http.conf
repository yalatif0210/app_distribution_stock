# Mode HTTP seul : utilisé quand aucun certificat n'est fourni dans certs/.
server_tokens off;
gzip on;
gzip_types text/plain text/css application/javascript application/json;

# Derrière le nginx de l'hôte (docker-compose.proxy.yml) : le visiteur arrive en HTTPS sur
# l'hôte, qui nous parle en HTTP. On garde le protocole d'origine et l'adresse du visiteur
# transmis par ce proxy ; sans proxy, ce sont ceux de la connexion directe.
map $http_x_forwarded_proto $proto_origine {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header   X-Forwarded-For;

server {
    listen 80;
    server_name _;
    include /etc/nginx/site.conf;
}
