# Mode HTTPS : activé quand certs/fullchain.pem et certs/privkey.pem existent.
server_tokens off;
gzip on;
gzip_types text/plain text/css application/javascript application/json;

# Accès direct en HTTPS : le protocole d'origine est celui de la connexion
map $http_x_forwarded_proto $proto_origine {
    default $scheme;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/site.conf;
}
