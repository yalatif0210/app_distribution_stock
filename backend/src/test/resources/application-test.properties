# ── Propriétés de test — ne jamais utiliser ces valeurs en production ──────────

# JWT — clé factice, longueur suffisante pour HS256 (>= 256 bits)
jwt.secret=placeholder-test-jwt-secret-key-do-not-use-in-production-environment
jwt.expiration=3600000

# APIs IA — clés factices, jamais envoyées vers de vrais services
mistral.api.key=PLACEHOLDER_MISTRAL_API_KEY_FOR_UNIT_TESTS_ONLY
mistral.api.url=http://fake-mistral-api.test/v1/chat/completions
mistral.api.model=mistral-small-latest

claude.api.key=PLACEHOLDER_CLAUDE_API_KEY_FOR_UNIT_TESTS_ONLY
claude.api.url=http://fake-claude-api.test/v1/messages
claude.api.model=claude-haiku-placeholder

# Seuils de stock — mêmes valeurs que prod pour la cohérence des tests
stock.seuil.tension=1.0
stock.seuil.surveiller=2.0
stock.seuil.surstock=4.0
stock.securite.mois=1.0

# Désactiver Flyway et la validation JPA en tests unitaires
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=none
