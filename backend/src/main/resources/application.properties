spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/redistribution_stocks
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
# Migrations du schéma et données de référence. En local seulement, docker-compose.local.yml
# ajoute les données d'exemple (backend/demo-db) : jamais sur un serveur.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.validate-on-migrate=false

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Comptes de démo (voir DataInitializer) : true seulement sur un poste de développement
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages
claude.api.model=claude-sonnet-4-6

mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions
mistral.api.model=mistral-small-latest

stock.securite.mois=1.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.lhspla=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Derrière des relais (nginx du conteneur, nginx de l'hôte, Cloudflare) : le protocole
# et l'hôte d'origine viennent des en-têtes X-Forwarded-*, acceptés seulement des adresses
# privées (réseau Docker). Sans cela, une page servie en https voit ses appels à l'API
# pris pour des requêtes d'un autre site et refusés (403 « Invalid CORS request »).
server.forward-headers-strategy=native
