spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/redistribution_stocks
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

jwt.secret=${JWT_SECRET:redistribution_stocks_jwt_secret_key_256bits_minimum_length_ok}
jwt.expiration=86400000

claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages
claude.api.model=claude-sonnet-4-6

mistral.api.key=${MISTRAL_API_KEY:}
mistral.api.url=https://api.mistral.ai/v1/chat/completions
mistral.api.model=mistral-small-latest

stock.seuil.tension=1.0
stock.seuil.surveiller=2.0
stock.seuil.surstock=4.0
stock.securite.mois=1.0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.lhspla=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
